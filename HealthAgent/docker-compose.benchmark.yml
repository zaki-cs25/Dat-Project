# Compose override for an isolated benchmark database; no existing volume is mounted.
# docker compose -p cp-benchmark -f docker-compose.yml -f docker-compose.benchmark.yml up --build -d
services:
  iris:
    container_name: central-park-benchmark-iris
    ports: !override
      - "127.0.0.1:1974:1972"
      - "127.0.0.1:52776:52773"
  agent:
    container_name: central-park-benchmark-agent
    ports: !override
      - "127.0.0.1:8003:8000"
    environment:
      CP_BENCHMARK_API_ENABLED: "true"
      CP_FHIR_BASE_URL: http://iris:52773/csp/healthshare/centralpark/fhir/r4
      CP_IRIS_REST_BASE_URL: http://iris:52773/centralpark
  ui:
    container_name: central-park-benchmark-ui
    ports: !override
      - "127.0.0.1:8503:80"
    environment:
      CP_FHIR_BASE_URL: http://iris:52773/csp/healthshare/centralpark/fhir/r4
      CP_AGENT_BASE_URL: http://agent:8000
volumes:
  iris-data:
    name: central-park-benchmark-iris-data
